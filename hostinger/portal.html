<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENTTECH | Portal de Cliente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07070D;--c1:#0F0F1A;--c2:#171728;--bd:#252540;--a:#00FF88;--a2:#00C8FF;--r:#FF4466;--t:#E8E8F0;--m:#7878A0}
body{background:var(--bg);color:var(--t);font-family:'DM Sans',sans-serif;min-height:100vh}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:400px;max-width:90vw;text-align:center}
.logo{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--m);letter-spacing:.25em;margin:4px 0 32px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:24px;margin-bottom:16px}
.lbl{font-size:11px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block}
.tk{width:100%;padding:14px 18px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--t);font-size:18px;outline:none;font-family:inherit;text-align:center;letter-spacing:.15em;box-sizing:border-box}
.tk:focus{border-color:var(--a)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;background:linear-gradient(135deg,var(--a),var(--a2));color:var(--bg);margin-top:14px;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bsm{padding:8px 16px;border-radius:8px;background:var(--c2);color:var(--t);border:1px solid var(--bd);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .2s}
.bsm:hover{border-color:var(--a);color:var(--a)}
.bsm.on{border-color:var(--a);color:var(--a);background:rgba(0,255,136,.06)}
.err{color:var(--r);font-size:12px;margin-top:10px}
.hdr{padding:14px 28px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 10px;border-radius:16px;font-weight:700;display:inline-block}
.tg{background:rgba(0,255,136,.12);color:var(--a)}
.tb{background:rgba(0,200,255,.12);color:var(--a2)}
.tabs{display:flex;gap:6px;padding:10px 28px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.cnt{padding:28px;max-width:900px;margin:0 auto}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sn{font-size:28px;font-weight:800}
.sl{font-size:11px;color:var(--m);margin-top:4px}
.pb{display:flex;gap:8px}
.sc{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin:0 auto 6px}
.sc.d{background:var(--a);color:var(--bg)}
.sc.p{background:var(--c2);color:var(--m);border:1px solid var(--bd)}
.stn{font-size:9px;color:var(--m)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.dt{font-size:15px;font-weight:700}
.dd{font-size:11px;color:var(--m)}
.dc{padding:16px;background:var(--c2);border-radius:10px;font-size:12px;line-height:1.8;white-space:pre-wrap;max-height:400px;overflow:auto}
.emp{text-align:center;color:var(--m);padding:40px}
.ai{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(37,37,64,.4)}
.ai:last-child{border-bottom:none}
.adot{width:8px;height:8px;border-radius:50%;background:var(--a);margin-top:5px;flex-shrink:0}
.at{font-size:13px;font-weight:600}
.adl{font-size:11px;color:var(--m)}
h2{font-size:20px;font-weight:700;margin-bottom:16px}
.ico{width:56px;height:56px;border-radius:50%;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.nm{font-size:13px;font-weight:600}
.hint{font-size:11px;color:var(--m);margin-top:8px}
a{color:var(--a);text-decoration:none}
a:hover{text-decoration:underline}
.metric{background:var(--c2);border-radius:10px;padding:12px;text-align:center}
.metric-n{font-size:22px;font-weight:800;color:var(--a)}
.metric-l{font-size:10px;color:var(--m);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--c2);overflow:hidden;margin-top:8px}
.prog-b{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .6s ease}
@media(max-width:600px){.cnt{padding:16px}.hdr{padding:12px 16px}.tabs{padding:8px 16px}.sg{grid-template-columns:1fr 1fr}.box{width:90vw}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Supabase config — main XENTTECH project ───────────────────────────────────
var SU = "https://oxlhmndvpogpdjutfxzr.supabase.co";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94bGhtbmR2cG9ncGRqdXRmeHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzUxMzgsImV4cCI6MjA5MjUxMTEzOH0.4_eOtdaMZDsmiYPKeRkwgaZHuSRlGm3TS1XHbxkt96s";
var HD = {"Content-Type":"application/json",apikey:SK,Authorization:"Bearer "+SK,Prefer:"return=representation"};

function db(t,p){return fetch(SU+"/rest/v1/"+t+"?"+(p||""),{headers:HD}).then(function(r){if(!r.ok)return[];return r.json()})}
function $(s){return document.querySelector(s)}
function esc(s){if(!s)return"";var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function fmt(d){if(!d)return"";try{return new Date(d).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function fmts(d){if(!d)return"";try{return new Date(d).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return d}}

var client=null,docs=[],camps=[],strats=[],designs=[],acts=[],tab="inicio";

function render(){document.getElementById("app").innerHTML=client?portal():loginPage()}

function loginPage(){
  return '<div class="wrap"><div class="box">'+
  '<div class="logo">XENTTECH</div>'+
  '<div class="sub">PORTAL DE CLIENTE</div>'+
  '<div class="card">'+
  '<div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00FF88" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>'+
  '<label class="lbl">Token de Acceso</label>'+
  '<input class="tk" id="tok" placeholder="••••••••" autocomplete="off">'+
  '<div id="err" class="err"></div>'+
  '<button class="btn" id="lb" onclick="doLogin()">Entrar al Portal</button>'+
  '</div>'+
  '<div class="hint">Token proporcionado por el equipo XENTTECH</div>'+
  '</div></div>';
}

function portal(){
  var steps=["Contrato","Factura","Brief","Welcome","Portal","Estrategia","Llamada"];
  var ts=[
    {i:"inicio",l:"Inicio"},
    {i:"docs",l:"Documentos"},
    {i:"camps",l:"Campañas"},
    {i:"strat",l:"Estrategia"},
    {i:"designs",l:"Diseños"},
    {i:"activity",l:"Actividad"}
  ];

  var h='<div class="hdr">'+
    '<div class="hdr-l">'+
      '<span class="logo" style="font-size:20px">XENTTECH</span>'+
      '<span style="font-size:11px;color:var(--m);border-left:1px solid var(--bd);padding-left:12px">Portal de Cliente</span>'+
    '</div>'+
    '<div class="hdr-r">'+
      '<span class="nm">'+esc(client.name)+'</span>'+
      (client.status?'<span class="tag tg">'+esc(client.status)+'</span>':'')+
      (client.plan?'<span class="tag tb">'+esc(client.plan)+'</span>':'')+
      '<button class="bsm" onclick="doLogout()">Salir</button>'+
    '</div>'+
  '</div>';

  h+='<div class="tabs">';
  for(var i=0;i<ts.length;i++){
    h+='<button class="bsm'+((tab===ts[i].i)?" on":"")+'" onclick="sw(\''+ts[i].i+'\')">'+ts[i].l+'</button>';
  }
  h+='</div><div class="cnt">';

  // ── INICIO ──────────────────────────────────────────────────────────────────
  if(tab==="inicio"){
    h+='<h2>Bienvenido, '+esc(client.name)+' 👋</h2>';

    // Progress tracker
    h+='<div class="card" style="margin-bottom:20px">'+
      '<div style="font-size:14px;font-weight:700;margin-bottom:4px">Progreso del Proyecto</div>'+
      '<div style="font-size:11px;color:var(--m);margin-bottom:16px">Paso '+(client.onboarding_step||1)+' de '+steps.length+'</div>'+
      '<div class="pb">';
    for(var i=0;i<steps.length;i++){
      var done=i+1<=(client.onboarding_step||1);
      h+='<div style="flex:1;text-align:center">'+
        '<div class="sc '+(done?"d":"p")+'">'+(done?"✓":(i+1))+'</div>'+
        '<div class="stn">'+steps[i]+'</div>'+
      '</div>';
    }
    h+='</div>';
    var pct=Math.round(((client.onboarding_step||1)/steps.length)*100);
    h+='<div class="prog" style="margin-top:16px"><div class="prog-b" style="width:'+pct+'%"></div></div>'+
      '<div style="text-align:right;font-size:10px;color:var(--a);margin-top:4px">'+pct+'% completado</div>';
    h+='</div>';

    // Stats
    h+='<div class="sg">';
    var ss=[
      {n:docs.length,l:"Documentos",c:"var(--a)"},
      {n:camps.length,l:"Campañas",c:"var(--a2)"},
      {n:strats.length,l:"Estrategias",c:"#FFD93D"},
      {n:designs.length,l:"Diseños",c:"#FF6B9D"}
    ];
    for(var i=0;i<ss.length;i++){
      h+='<div class="card" style="text-align:center;margin-bottom:0">'+
        '<div class="sn" style="color:'+ss[i].c+'">'+ss[i].n+'</div>'+
        '<div class="sl">'+ss[i].l+'</div>'+
      '</div>';
    }
    h+='</div>';

    // Recent activity
    if(acts.length>0){
      h+='<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">Actividad Reciente</div>';
      for(var i=0;i<Math.min(acts.length,5);i++){
        h+='<div class="ai">'+
          '<div class="adot"></div>'+
          '<div><div class="at">'+esc(acts[i].action)+'</div>'+
          '<div class="adl">'+(acts[i].details?esc(acts[i].details)+' · ':'')+fmts(acts[i].created_at)+'</div></div>'+
        '</div>';
      }
      h+='</div>';
    }

    // Quick links
    h+='<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">Accesos Directos</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="bsm" onclick="sw(\'docs\')">📄 Documentos</button>'+
      '<button class="bsm" onclick="sw(\'camps\')">📊 Campañas</button>'+
      '<button class="bsm" onclick="sw(\'strat\')">🎯 Estrategia</button>'+
      '<button class="bsm" onclick="sw(\'designs\')">🎨 Diseños</button>'+
      '</div></div>';
  }

  // ── DOCUMENTOS ──────────────────────────────────────────────────────────────
  if(tab==="docs"){
    h+='<h2>📄 Documentos del Proyecto</h2>';
    if(!docs.length){
      h+='<div class="card emp">'+
        '<div style="font-size:32px;margin-bottom:12px">📋</div>'+
        'Tus documentos aparecerán aquí cuando el equipo los genere.<br>'+
        '<span style="font-size:11px">Normalmente listos en las primeras 48 horas.</span>'+
      '</div>';
    }
    for(var i=0;i<docs.length;i++){
      var d=docs[i];
      var icons={"Contrato":"📝","Factura":"🧾","Welcome Document":"💛","Portal de Cliente":"🌐","Setup de Estrategia":"🎯","Llamada de Estrategia":"📞"};
      var ico=icons[d.step_name]||"📄";
      var sc={"pending":"tb","in_progress":"tb","completed":"tg"};
      h+='<div class="card">'+
        '<div class="dh">'+
          '<div><div class="dt">'+ico+' '+esc(d.step_name||"Paso "+d.step_number)+'</div>'+
          '<div class="dd">'+fmt(d.created_at)+'</div></div>'+
          '<span class="tag '+(sc[d.status]||"tb")+'">'+esc(d.status)+'</span>'+
        '</div>'+
        (d.content?'<div class="dc">'+esc(d.content)+'</div>':'')+
      '</div>';
    }
  }

  // ── CAMPAÑAS ────────────────────────────────────────────────────────────────
  if(tab==="camps"){
    h+='<h2>📊 Campañas Activas</h2>';
    if(!camps.length){
      h+='<div class="card emp">'+
        '<div style="font-size:32px;margin-bottom:12px">📣</div>'+
        'Sin campañas activas aún.<br>'+
        '<span style="font-size:11px">Se mostrarán una vez que se lancen.</span>'+
      '</div>';
    }
    for(var i=0;i<camps.length;i++){
      var c=camps[i];
      var pi={"meta":"📘","google":"🔍","tiktok":"🎵","linkedin":"💼","youtube":"▶️"};
      var pico=pi[c.platform]||"📣";
      var sc2={"active":"tg","paused":"tb","draft":"tb","completed":"tg"};
      h+='<div class="card">'+
        '<div class="dh">'+
          '<div>'+
            '<div class="dt">'+pico+' '+esc(c.campaign_name)+'</div>'+
            '<div class="dd">'+esc(c.platform||"")+' · '+esc(c.objective||"")+' · '+(c.budget_monthly?'$'+Number(c.budget_monthly).toLocaleString()+'/mes':'')+'</div>'+
          '</div>'+
          '<span class="tag '+(sc2[c.status]||"tb")+'">'+esc(c.status)+'</span>'+
        '</div>'+
        (c.audience?'<div class="dd" style="margin-top:8px">👥 Audiencia: '+esc(c.audience)+'</div>':'')+
      '</div>';
    }
  }

  // ── ESTRATEGIA ──────────────────────────────────────────────────────────────
  if(tab==="strat"){
    h+='<h2>🎯 Estrategia Digital</h2>';
    if(!strats.length){
      h+='<div class="card emp">'+
        '<div style="font-size:32px;margin-bottom:12px">🗺️</div>'+
        'Tu estrategia aparecerá aquí cuando esté lista.<br>'+
        '<span style="font-size:11px">Generada y revisada por el equipo XENTTECH.</span>'+
      '</div>';
    }
    for(var i=0;i<strats.length;i++){
      var s=strats[i];
      var sc3={"active":"tg","approved":"tg","draft":"tb","archived":"tb"};
      h+='<div class="card">'+
        '<div class="dh">'+
          '<div class="dt">'+esc(s.title)+'</div>'+
          '<span class="tag '+(sc3[s.status]||"tb")+'">'+esc(s.status)+'</span>'+
        '</div>'+
        (s.content?'<div class="dc">'+esc(s.content)+'</div>':'')+
      '</div>';
    }
  }

  // ── DISEÑOS ─────────────────────────────────────────────────────────────────
  if(tab==="designs"){
    h+='<h2>🎨 Diseños y Creativos</h2>';
    if(!designs.length){
      h+='<div class="card emp">'+
        '<div style="font-size:32px;margin-bottom:12px">🖼️</div>'+
        'Tus piezas de diseño aparecerán aquí.<br>'+
        '<span style="font-size:11px">Incluye posts, stories, banners y más.</span>'+
      '</div>';
    }
    for(var i=0;i<designs.length;i++){
      var d2=designs[i];
      var ti={"post":"🖼️","story":"📱","banner":"🎯","video_script":"🎬","carousel":"🎠","reels_script":"🎥","email_header":"📧"};
      var sc4={"pending":"tb","in_review":"tb","approved":"tg","delivered":"tg"};
      h+='<div class="card">'+
        '<div class="dh">'+
          '<div class="dt">'+(ti[d2.design_type]||"🎨")+' '+esc((d2.design_type||"").replace(/_/g," "))+'</div>'+
          '<span class="tag '+(sc4[d2.status]||"tb")+'">'+esc(d2.status)+'</span>'+
        '</div>'+
        (d2.brief?'<div class="dc">'+esc(d2.brief)+'</div>':'')+
        (d2.canva_url?'<a href="'+esc(d2.canva_url)+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;padding:8px 16px;border-radius:8px;border:1px solid rgba(0,255,136,.3);font-size:12px;font-weight:700;color:var(--a)">Ver diseño en Canva →</a>':'')+
      '</div>';
    }
  }

  // ── ACTIVIDAD ───────────────────────────────────────────────────────────────
  if(tab==="activity"){
    h+='<h2>📋 Historial de Actividad</h2>';
    if(!acts.length){
      h+='<div class="card emp">Sin actividad registrada aún.</div>';
    } else {
      h+='<div class="card">';
      for(var i=0;i<acts.length;i++){
        h+='<div class="ai">'+
          '<div class="adot"></div>'+
          '<div><div class="at">'+esc(acts[i].action)+'</div>'+
          '<div class="adl">'+(acts[i].details?esc(acts[i].details)+' · ':'')+fmts(acts[i].created_at)+'</div></div>'+
        '</div>';
      }
      h+='</div>';
    }
  }

  h+='</div>';
  return h;
}

function doLogin(){
  var t=document.getElementById("tok").value.trim();
  if(!t)return;
  var b=document.getElementById("lb");
  b.disabled=true;b.textContent="Verificando...";
  var errEl=document.getElementById("err");
  errEl.textContent="";

  db("portal_tokens","token=eq."+encodeURIComponent(t)+"&is_active=eq.true&select=*").then(function(tks){
    if(!tks||!tks.length){
      errEl.textContent="Token inválido o inactivo";
      b.disabled=false;b.textContent="Entrar al Portal";
      return;
    }
    return db("clients","id=eq."+tks[0].client_id+"&select=*").then(function(cls){
      if(!cls||!cls.length){
        errEl.textContent="Cliente no encontrado";
        b.disabled=false;b.textContent="Entrar al Portal";
        return;
      }
      client=cls[0];
      return Promise.all([
        db("onboarding_documents","client_id=eq."+client.id+"&order=step_number.asc&select=*"),
        db("campaigns","client_id=eq."+client.id+"&order=created_at.desc&select=*"),
        db("strategies","client_id=eq."+client.id+"&order=created_at.desc&select=*"),
        db("designs","client_id=eq."+client.id+"&order=created_at.desc&select=*"),
        db("activity_log","client_id=eq."+client.id+"&order=created_at.desc&limit=30&select=*")
      ]).then(function(r){
        docs=r[0]||[];camps=r[1]||[];strats=r[2]||[];designs=r[3]||[];acts=r[4]||[];
        render();
      });
    });
  }).catch(function(e){
    errEl.textContent="Error de conexión. Intenta de nuevo.";
    b.disabled=false;b.textContent="Entrar al Portal";
  });
}

function doLogout(){client=null;docs=[];camps=[];strats=[];designs=[];acts=[];tab="inicio";render()}
function sw(t){tab=t;render();window.scrollTo(0,0)}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&document.getElementById("tok"))doLogin()});
render();
</script>
</body>
</html>
